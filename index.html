  view.appendChild(tools);
  view.appendChild(h("p", { class:"tools-hint", text:"Alle Daten liegen offline auf diesem Gerät. Export sichert sie als JSON-Datei." }));

  return view;
}

var hiddenSeries = {};

function collectSeries(){
  var metric = ui.metric || "day:total";
  var parts = metric.split(":");
  if(parts[0] === "ex"){
    var ex = EX_BY_ID[parts[1]];
    if(!ex) return { title:"Fortschritt", sub:"", series:[] };
    var home = DAY_OF_EX[ex.id];
    var inPlan = home && home.ex.some(function(e){ return e.id === ex.id; });
    var bits = [];
    if(home) bits.push(home.name);
    if(ex.p) bits.push("Gewicht " + ex.p);
    if(!inPlan) bits.push("ersetzt");
    return {
      title: ex.n,
      sub: bits.join(" · "),
      series: [{ id:ex.id, name:ex.n, slot:0, points:historyOf(ex.id) }]
    };
  }
  var day = DAYS.filter(function(d){ return d.id === parts[1]; })[0] || DAYS[0];
  return {
    title: day.name,
    sub: day.ex.length + " Übungen · Gewichtsverlauf",
    series: day.ex.map(function(e, i){ return { id:e.id, name:e.n, slot:i % 8, points:historyOf(e.id) }; })
  };
}

function niceTicks(min, max, count){
  if(!(max > min)){ min = min - 1; max = max + 1; }
  var raw = (max - min) / Math.max(count, 1);
  var mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var norm = raw / mag;
  var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  var start = Math.floor(min / step) * step;
  var ticks = [];
  for(var v = start; v <= max + step * 0.5; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return ticks;
}

function renderProgress(){
  var wrap = document.getElementById("chart-wrap");
  if(!wrap) return;
  var data = collectSeries();

  document.getElementById("chart-title").textContent = data.title;
  document.getElementById("chart-sub").textContent = data.sub;

  var visible = data.series.filter(function(s){ return !hiddenSeries[s.id]; });
  var withData = visible.filter(function(s){ return s.points.length > 0; });

  drawChart(wrap, withData, data.series.length);
  drawLegend(data.series);
  drawTable(data.series);
}

function drawChart(wrap, series, totalSeries){
  var old = wrap.querySelector("svg");
  if(old) old.remove();
  var note = wrap.parentNode.querySelector(".empty-note");
  if(note) note.remove();

  var W = Math.max(wrap.clientWidth || 320, 260);
  var directLabels = totalSeries <= 4 && series.length > 0;
  var padT = 24, padB = 30, padL = 46, padR = directLabels ? 54 : 14;
  var plotH = 220;
  var H = padT + plotH + padB;
  var plotW = Math.max(W - padL - padR, 60);

  var s = svg("svg", {
    width:W, height:H, viewBox:"0 0 "+W+" "+H,
    role:"img",
    "aria-label": series.length ? "Gewichtsverlauf über die Zeit" : "Gewichtsverlauf — noch keine Daten erfasst"
  });

  /* --- Domains --- */
  var allT = [], allV = [];
  series.forEach(function(sr){ sr.points.forEach(function(p){ allT.push(isoToDate(p.date).getTime()); allV.push(p.w); }); });

  var empty = allV.length === 0;
  var vMin, vMax, tMin, tMax, ticks;

  if(empty){
    ticks = [0, 25, 50, 75, 100];
    vMin = 0; vMax = 100;
    tMax = Date.now(); tMin = tMax - 30*864e5;
  } else {
    var lo = Math.min.apply(null, allV), hi = Math.max.apply(null, allV);
    var pad = (hi - lo) * 0.12 || Math.max(hi * 0.08, 1);
    ticks = niceTicks(Math.max(lo - pad, 0), hi + pad, 4);
    vMin = ticks[0]; vMax = ticks[ticks.length-1];
    tMin = Math.min.apply(null, allT); tMax = Math.max.apply(null, allT);
    if(tMin === tMax){ tMin -= 3*864e5; tMax += 3*864e5; }
  }

  function X(t){ return padL + (tMax === tMin ? plotW/2 : (t - tMin) / (tMax - tMin) * plotW); }
  function Y(v){ return padT + plotH - (vMax === vMin ? plotH/2 : (v - vMin) / (vMax - vMin) * plotH); }

  /* --- Gitternetz + Y-Achse --- */
  ticks.forEach(function(v){
    var y = Y(v);
    svg("line", { x1:padL, y1:y.toFixed(1), x2:padL+plotW, y2:y.toFixed(1), stroke:"var(--grid)", "stroke-width":"1" }, s);
    var tx = svg("text", { x:padL-8, y:(y+4).toFixed(1), "text-anchor":"end", fill:"var(--muted)", "font-size":"10.5", "font-family":"system-ui,-apple-system,'Segoe UI',sans-serif", "font-variant-numeric":"tabular-nums" }, s);
    tx.textContent = fmtKg(v);
  });
  svg("line", { x1:padL, y1:padT, x2:padL, y2:padT+plotH, stroke:"var(--axis)", "stroke-width":"1" }, s);
  svg("line", { x1:padL, y1:padT+plotH, x2:padL+plotW, y2:padT+plotH, stroke:"var(--axis)", "stroke-width":"1" }, s);

  var yl = svg("text", { x:padL-8, y:padT-10, "text-anchor":"end", fill:"var(--muted)", "font-size":"10", "font-family":"system-ui,-apple-system,'Segoe UI',sans-serif" }, s);
  yl.textContent = "kg";

  /* --- Leerzustand: langgezogener Strich durch den Nullpunkt --- */
  if(empty){
    var y0 = Y(0);
    svg("line", { x1:padL, y1:y0, x2:padL+plotW, y2:y0, stroke:"var(--muted)", "stroke-width":"2", "stroke-linecap":"round", opacity:"0.55" }, s);
    svg("circle", { cx:padL, cy:y0, r:"4", fill:"var(--muted)", stroke:"var(--surface-1)", "stroke-width":"2" }, s);
    var xt0 = svg("text", { x:padL, y:padT+plotH+18, "text-anchor":"start", fill:"var(--muted)", "font-size":"10.5", "font-family":"system-ui,-apple-system,'Segoe UI',sans-serif" }, s);
    xt0.textContent = "Zeit";
    wrap.insertBefore(s, wrap.firstChild);
    var p = h("p", { class:"empty-note", text:"Noch keine gespeicherten Einheiten — der Verlauf startet mit der ersten gespeicherten Einheit." });
    wrap.parentNode.insertBefore(p, wrap.nextSibling);
    return;
  }

  /* --- X-Achse (Zeit) --- */
  var uniq = Array.from(new Set(allT)).sort(function(a,b){ return a-b; });
  var maxLabels = Math.max(2, Math.min(4, Math.floor(plotW / 62)));
  var labelTs = uniq.length <= maxLabels ? uniq : (function(){
    var out = [];
    for(var i=0;i<maxLabels;i++) out.push(uniq[Math.round(i * (uniq.length-1) / (maxLabels-1))]);
    return Array.from(new Set(out));
  })();
  labelTs.forEach(function(t, i){
    var x = X(t);
    var anchor = i === 0 ? "start" : (i === labelTs.length-1 ? "end" : "middle");
    var tx = svg("text", { x:x.toFixed(1), y:padT+plotH+18, "text-anchor":anchor, fill:"var(--muted)", "font-size":"10.5", "font-family":"system-ui,-apple-system,'Segoe UI',sans-serif", "font-variant-numeric":"tabular-nums" }, s);
    tx.textContent = DF_SHORT.format(new Date(t));
  });

  /* --- Linien --- */
  series.forEach(function(sr){
    var col = "var(" + SERIES_VARS[sr.slot] + ")";
    var pts = sr.points.map(function(p){ return { x:X(isoToDate(p.date).getTime()), y:Y(p.w), w:p.w }; });
    if(pts.length > 1){
      var d = pts.map(function(p, i){ return (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" ");
      svg("path", { d:d, fill:"none", stroke:col, "stroke-width":"2", "stroke-linecap":"round", "stroke-linejoin":"round" }, s);
    }
    pts.forEach(function(p, i){
      var isLast = i === pts.length-1;
      svg("circle", {
        cx:p.x.toFixed(1), cy:p.y.toFixed(1), r: isLast ? "4.5" : (pts.length > 12 ? "0" : "3.5"),
        fill:col, stroke:"var(--surface-1)", "stroke-width":"2"
      }, s);
    });
    if(directLabels && pts.length){
      var lastP = pts[pts.length-1];
      var lab = svg("text", {
        x:(lastP.x + 8).toFixed(1), y:(lastP.y + 4).toFixed(1),
        fill:"var(--text-1)", "font-size":"11.5", "font-weight":"650",
        "font-family":"system-ui,-apple-system,'Segoe UI',sans-serif", "font-variant-numeric":"tabular-nums"
      }, s);
      lab.textContent = fmtKg(lastP.w);
    }
  });

  /* --- Crosshair + Tooltip --- */
  var cross = svg("line", { x1:0, y1:padT, x2:0, y2:padT+plotH, stroke:"var(--axis)", "stroke-width":"1", opacity:"0" }, s);
  var hit = svg("rect", { x:padL, y:padT, width:plotW, height:plotH, fill:"transparent", tabindex:"0", role:"application", "aria-label":"Diagramm erkunden — mit Pfeiltasten durch die Termine navigieren" }, s);

  var tip = document.getElementById("tip");
  var focusIdx = uniq.length - 1;

  function show(idx){
    idx = Math.max(0, Math.min(uniq.length-1, idx));
    focusIdx = idx;
    var t = uniq[idx];
    var x = X(t);
    cross.setAttribute("x1", x.toFixed(1));
    cross.setAttribute("x2", x.toFixed(1));
    cross.setAttribute("opacity", "1");

    while(tip.firstChild) tip.removeChild(tip.firstChild);
    var head = h("div", { class:"tip-date" });
    head.textContent = DF_LONG.format(new Date(t));
    tip.appendChild(head);

    var rows = 0;
    series.forEach(function(sr){
      var hitPt = sr.points.filter(function(p){ return isoToDate(p.date).getTime() === t; })[0];
      if(!hitPt) return;
      rows++;
      var row = h("div", { class:"tip-row" });
      var key = h("span", { class:"tip-key" });
      key.style.background = "var(" + SERIES_VARS[sr.slot] + ")";
      row.appendChild(key);
      var val = h("span", { class:"tip-val" });
      val.textContent = fmtKg(hitPt.w) + " kg";
      row.appendChild(val);
      var nm = h("span", { class:"tip-name" });
      nm.textContent = sr.name;
      row.appendChild(nm);
      tip.appendChild(row);
    });
    if(!rows){
      var none = h("div", { class:"tip-name" });
      none.textContent = "Keine Werte";
      tip.appendChild(none);
    }

    tip.classList.add("on");
    tip.setAttribute("aria-hidden", "false");
    var tw = tip.offsetWidth || 130;
    var left = Math.max(tw/2 + 2, Math.min(W - tw/2 - 2, x));
    tip.style.left = left + "px";
    tip.style.top  = (padT - 8) + "px";
  }
  function hide(){
    cross.setAttribute("opacity", "0");
    tip.classList.remove("on");
    tip.setAttribute("aria-hidden", "true");
  }
  function nearest(clientX){
    var box = s.getBoundingClientRect();
    var scale = W / box.width;
    var px = (clientX - box.left) * scale;
    var best = 0, bestD = Infinity;
    uniq.forEach(function(t, i){ var d = Math.abs(X(t) - px); if(d < bestD){ bestD = d; best = i; } });
    return best;
  }

  hit.addEventListener("pointermove", function(e){ show(nearest(e.clientX)); });
  hit.addEventListener("pointerdown", function(e){ show(nearest(e.clientX)); });
  hit.addEventListener("pointerleave", hide);
  hit.addEventListener("pointercancel", hide);
  hit.addEventListener("focus", function(){ show(focusIdx); });
  hit.addEventListener("blur", hide);
  hit.addEventListener("keydown", function(e){
    if(e.key === "ArrowLeft"){ e.preventDefault(); show(focusIdx - 1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); show(focusIdx + 1); }
    else if(e.key === "Escape"){ hide(); }
  });

  wrap.insertBefore(s, wrap.firstChild);
}

function drawLegend(allSeries){
  var box = document.getElementById("legend");
  while(box.firstChild) box.removeChild(box.firstChild);
  if(allSeries.length < 2) return;

  allSeries.forEach(function(sr){
    var on = !hiddenSeries[sr.id];
    var b = h("button", { type:"button", "aria-pressed": on ? "true" : "false" });
    var key = h("span", { class:"lkey" });
    key.style.background = "var(" + SERIES_VARS[sr.slot] + ")";
    b.appendChild(key);
    var nm = document.createElement("span");
    nm.textContent = sr.name;
    b.appendChild(nm);
    b.addEventListener("click", function(){
      if(hiddenSeries[sr.id]) delete hiddenSeries[sr.id]; else hiddenSeries[sr.id] = true;
      renderProgress();
    });
    box.appendChild(b);
  });
}

function drawTable(allSeries){
  var box = document.getElementById("table-scroll");
  while(box.firstChild) box.removeChild(box.firstChild);

  var dates = [];
  allSeries.forEach(function(sr){ sr.points.forEach(function(p){ if(dates.indexOf(p.date) < 0) dates.push(p.date); }); });
  dates.sort();

  if(!dates.length){
    box.appendChild(h("p", { class:"empty-note", text:"Noch keine Werte gespeichert." }));
    return;
  }

  var table = document.createElement("table");
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  hr.appendChild(h("th", { scope:"col", text:"Datum" }));
  allSeries.forEach(function(sr){
    var th = h("th", { scope:"col" });
    th.textContent = sr.name;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);

  var tbody = document.createElement("tbody");
  dates.forEach(function(dt){
    var tr = document.createElement("tr");
    var th = h("th", { scope:"row" });
    th.textContent = DF_LONG.format(isoToDate(dt));
    tr.appendChild(th);
    allSeries.forEach(function(sr){
      var p = sr.points.filter(function(x){ return x.date === dt; })[0];
      var td = document.createElement("td");
      if(p){ td.textContent = fmtKg(p.w) + " kg"; }
      else { td.textContent = "—"; td.className = "na"; }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);
}

/* ============================================================
   10. Export / Import
   ============================================================ */
function exportData(){
  var payload = {
    app:"trainingsplan", version:2, exported:new Date().toISOString(),
    sessions:sessions,
    plan:{ order:planOrder, exercises:customEx, spec:exSpec }
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "trainingsplan-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function importData(){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json,.json";
  inp.addEventListener("change", function(){
    var file = inp.files && inp.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try { parsed = JSON.parse(String(reader.result)); }
      catch(e){ toast("Datei konnte nicht gelesen werden"); return; }
      if(!parsed || !Array.isArray(parsed.sessions)){ toast("Kein gültiger Trainingsplan-Export"); return; }

      /* Getauschte Übungen zuerst übernehmen — sonst fielen ihre Werte
         unten durch die EX_BY_ID-Prüfung. */
      if(parsed.plan && typeof parsed.plan === "object"){
        var ex = parsed.plan.exercises;
        if(ex && typeof ex === "object"){
          Object.keys(ex).forEach(function(id){
            var e = ex[id];
            if(!e || typeof e.n !== "string" || !e.n) return;
            customEx[id] = { id:id, n:e.n, sets:e.sets, rmin:e.rmin, rmax:e.rmax,
                             p:e.p || "", planTrend:null, dayId:e.dayId || null };
            POOL[id] = customEx[id];
          });
        }
        var sp = parsed.plan.spec;
        if(sp && typeof sp === "object"){
          Object.keys(sp).forEach(function(id){
            var o = sp[id];
            if(!POOL[id] || !o) return;
            exSpec[id] = { sets:o.sets, rmin:o.rmin, rmax:o.rmax != null ? o.rmax : null };
          });
        }
        var ord = parsed.plan.order;
        if(ord && typeof ord === "object"){
          DAYS.forEach(function(d){
            if(Array.isArray(ord[d.id]) && ord[d.id].every(function(id){ return !!POOL[id]; })){
              planOrder[d.id] = ord[d.id];
            }
          });
        }
        savePlan();
        applyPlan();
      }

      var added = 0;
      parsed.sessions.forEach(function(s){
        if(!s || typeof s.date !== "string" || !s.entries) return;
        if(!DAYS.some(function(d){ return d.id === s.dayId; })) return;
        var target = null;
        for(var i=0;i<sessions.length;i++){
          if(sessions[i].dayId === s.dayId && sessions[i].date === s.date){ target = sessions[i]; break; }
        }
        if(!target){ target = { date:s.date, dayId:s.dayId, entries:{} }; sessions.push(target); }
        for(var k in s.entries){
          if(!EX_BY_ID[k]) continue;
          var e = s.entries[k];
          var w = (e && typeof e.w === "number" && isFinite(e.w)) ? e.w : null;
          var t = (e && ["up","hold","down"].indexOf(e.t) >= 0) ? e.t : null;
          if(w == null && !t) continue;
          target.entries[k] = { w:w, t:t };
          added++;
        }
      });
      saveSessions();
      rebuildAll();
      toast(added ? plural(added, "Wert", "Werte") + " importiert" : "Nichts zu importieren");
    };
    reader.readAsText(file);
  });
  inp.click();
}

/* ============================================================
   9b. Trainings-Log — gespeicherte Einheiten nachträglich ändern
   ============================================================ */
function findSession(dayId, date){
  for(var i=0;i<sessions.length;i++){
    if(sessions[i].dayId === dayId && sessions[i].date === date) return sessions[i];
  }
  return null;
}

function afterLogChange(){
  saveSessions();
  refreshFromData();
  renderLog();
}

function deleteEntry(session, exId){
  delete session.entries[exId];
  if(!Object.keys(session.entries).length){
    sessions = sessions.filter(function(s){ return s !== session; });
    Sync.removeSession(session);
  } else {
    Sync.removeEntry(session, exId);
  }
  afterLogChange();
}

function deleteSession(session){
  sessions = sessions.filter(function(s){ return s !== session; });
  Sync.removeSession(session);
  afterLogChange();
}

function buildLogRow(session){
  var day = dayById(session.dayId);
  var det = h("details", { class:"log-item" });

  var ids = Object.keys(session.entries);
  var sum = h("summary");
  sum.appendChild(h("span", { class:"log-date", text:DF_LONG.format(isoToDate(session.date)) }));
  sum.appendChild(h("span", { class:"log-day", text:day ? day.name : session.dayId }));
  sum.appendChild(h("span", { class:"log-count", text:plural(ids.length, "Übung", "Übungen") }));
  det.appendChild(sum);

  var list = h("div", { class:"log-rows" });

  /* Reihenfolge des Trainingstags beibehalten, Unbekanntes hinten anhängen. */
  var ordered = [];
  if(day) day.ex.forEach(function(e){ if(session.entries[e.id]) ordered.push(e.id); });
  ids.forEach(function(id){ if(ordered.indexOf(id) < 0) ordered.push(id); });

  ordered.forEach(function(id){
    var entry = session.entries[id];
    var row = h("div", { class:"log-row" });
    row.appendChild(h("span", { class:"log-ex", text:(POOL[id] || {}).n || id }));

    var field = h("label", { class:"log-field" });
    var inp = h("input", { type:"text", inputmode:"decimal", autocomplete:"off",
      "aria-label":"Gewicht " + ((POOL[id] || {}).n || id) + " am " + session.date });
    inp.value = entry.w != null ? fmtKg(entry.w) : "";
    inp.addEventListener("input", function(){
      inp.value = sanitizeInput(inp.value);
    });
    function commit(){
      var w = parseKg(inp.value);
      /* Leer oder unlesbar heisst nicht "kein Gewicht" — zum Entfernen gibt es das ×. */
      if(w == null){ inp.value = entry.w != null ? fmtKg(entry.w) : ""; return; }
      if(w === entry.w) return;
      entry.w = w;
      saveSessions();
      Sync.push(session);
      /* Bewusst ohne renderLog(): sonst würde das gerade bearbeitete Feld ersetzt. */
      refreshFromData();
    }
    inp.addEventListener("blur", commit);
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); inp.blur(); } });
    field.appendChild(inp);
    field.appendChild(h("span", { class:"log-unit", text:"kg" }));
    row.appendChild(field);

    var tr = TRENDS.filter(function(t){ return t.t === entry.t; })[0];
    row.appendChild(h("span", { class:"log-trend " + (entry.t || "none"),
      text: tr ? tr.gly : "·", title: tr ? tr.label : "keine Tendenz" }));

    var del = h("button", { class:"log-del", type:"button",
      "aria-label":"Eintrag löschen: " + ((POOL[id] || {}).n || id), title:"Eintrag löschen", text:"×" });
    del.addEventListener("click", function(){ deleteEntry(session, id); });
    row.appendChild(del);

    list.appendChild(row);
  });

  var wipe = h("button", { class:"btn-line danger-ghost log-wipe", type:"button", text:"Ganze Einheit löschen" });
  wipe.addEventListener("click", function(){
    askConfirm({
      title:"Einheit löschen",
      lead:(day ? day.name : session.dayId) + " vom " + DF_LONG.format(isoToDate(session.date))
        + " mit " + plural(Object.keys(session.entries).length, "Eintrag", "Einträgen")
        + " endgültig entfernen?",
      okLabel:"Löschen", danger:true
    }).then(function(ok){ if(ok){ deleteSession(session); toast("Einheit gelöscht"); } });
  });
  list.appendChild(wipe);

  det.appendChild(list);
  return det;
}

function renderLog(){
  var box = document.getElementById("log-body");
  if(!box) return;
  var open = {};
  box.querySelectorAll("details[open]").forEach(function(d){ open[d.dataset.key] = true; });
  while(box.firstChild) box.removeChild(box.firstChild);

  if(!sessions.length){
    box.appendChild(h("p", { class:"empty-note",
      text:"Noch keine Einheit gespeichert. Gespeicherte Trainings erscheinen hier und lassen sich hier auch korrigieren." }));
    return;
  }

  var sorted = sessions.slice().sort(function(a,b){
    return a.date < b.date ? 1 : a.date > b.date ? -1 : a.dayId.localeCompare(b.dayId);
  });
  sorted.forEach(function(s){
    var row = buildLogRow(s);
    row.dataset.key = s.dayId + "_" + s.date;
    if(open[row.dataset.key]) row.open = true;
    box.appendChild(row);
  });
}

/* ============================================================
   9c. Sätze und Wiederholungen ändern
   ------------------------------------------------------------
   Enter übernimmt, Tippen daneben oder Escape bricht ab. Die
   Änderung gilt nur für diese Übung und wird wie der Tausch im
   Plan gespeichert.
   ============================================================ */
var specCtx = null;

function openSpec(exId, which){
  var ex = POOL[exId];
  if(!ex) return;
  specCtx = { exId:exId, which:which };

  var dlg    = document.getElementById("spec-dialog");
  var fields = document.getElementById("spec-fields");
  while(fields.firstChild) fields.removeChild(fields.firstChild);

  document.getElementById("spec-dlg-title").textContent =
    which === "sets" ? "Sätze" : "Wiederholungen";
  document.getElementById("spec-dlg-lead").textContent = ex.n;
  document.getElementById("spec-hint").textContent =
    which === "sets" ? "Enter übernimmt, daneben tippen bricht ab."
                     : "Für eine feste Zahl beide Felder gleich setzen. Enter übernimmt.";

  function numField(label, value, ref){
    var wrap = h("label", { class:"spec-f" });
    wrap.appendChild(h("span", { text:label }));
    var inp = h("input", { type:"text", inputmode:"numeric", autocomplete:"off",
      enterkeyhint:"done", maxlength:"2", "aria-label":label });
    inp.value = value != null ? String(value) : "";
    inp.addEventListener("input", function(){ inp.value = inp.value.replace(/[^0-9]/g, "").slice(0, 2); });
    inp.addEventListener("focus", function(){ inp.select(); });
    wrap.appendChild(inp);
    fields.appendChild(wrap);
    ref.push(inp);
    return inp;
  }

  var inputs = [];
  if(which === "sets"){
    numField("Anzahl", ex.sets, inputs);
  } else {
    numField("von", ex.rmin, inputs);
    fields.appendChild(h("span", { class:"spec-dash", text:"–" }));
    numField("bis", ex.rmax != null ? ex.rmax : ex.rmin, inputs);
  }

  function commit(){
    var vals = inputs.map(function(i){ return parseInt(i.value, 10); });
    if(vals.some(function(v){ return !isFinite(v) || v < 1 || v > 99; })){
      toast("Bitte eine Zahl zwischen 1 und 99 eingeben");
      return;
    }
    if(which === "sets") setSpec(exId, { sets:vals[0] });
    else {
      var lo = Math.min(vals[0], vals[1]), hi = Math.max(vals[0], vals[1]);
      setSpec(exId, { rmin:lo, rmax:hi > lo ? hi : null });
    }
    specCtx = null;
    if(typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open");
    rebuildAll();
  }

  inputs.forEach(function(inp){
    inp.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); commit(); }
    });
  });

  if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  setTimeout(function(){ inputs[0].focus(); inputs[0].select(); }, 60);
}

function setSpec(exId, patch){
  var cur = exSpec[exId] || {};
  var ex  = POOL[exId] || {};
  var next = {
    sets: patch.sets != null ? patch.sets : (cur.sets != null ? cur.sets : ex.sets),
    rmin: patch.rmin != null ? patch.rmin : (cur.rmin != null ? cur.rmin : ex.rmin),
    rmax: ("rmax" in patch) ? patch.rmax : (("rmax" in cur) ? cur.rmax : ex.rmax)
  };
  exSpec[exId] = next;
  savePlan();
  applyPlan();
  Sync.pushPlan();
}

/** Klick auf den Hintergrund des Dialogs bricht ab — wie Escape. */
function wireSpecUi(){
  var dlg = document.getElementById("spec-dialog");
  dlg.addEventListener("click", function(e){
    if(e.target === dlg){
      specCtx = null;
      if(typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open");
    }
  });
  dlg.addEventListener("close", function(){ specCtx = null; });
}

/* ============================================================
   10b. Übung tauschen
   ------------------------------------------------------------
   Der Slot im Trainingstag zeigt danach auf eine andere Übung.
   Die ersetzte Übung bleibt mit ihrem Verlauf im POOL und ist im
   Fortschritt unter "Ersetzte Übungen" weiter auswählbar. Ein
   bereits bekannter Name wird wiederverwendet, damit beim
   Zurücktauschen die alte Historie wieder zusammenfindet.
   ============================================================ */
function slugId(name){
  var base = "cx-" + name.toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/ß/g, "ss")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32);
  if(base === "cx-") base = "cx-uebung";
  var id = base, n = 2;
  while(POOL[id]) id = base + "-" + (n++);
  return id;
}

function findByName(name){
  var key = name.trim().toLowerCase();
  var ids = Object.keys(POOL);
  for(var i=0;i<ids.length;i++) if(POOL[ids[i]].n.trim().toLowerCase() === key) return POOL[ids[i]];
  return null;
}

/** Ersetzt die Übung im Slot. Gibt bei Problemen eine Meldung zurück, sonst null. */
function swapExercise(dayId, oldId, rawName){
  var name = String(rawName || "").trim().replace(/\s+/g, " ");
  if(!name) return "Bitte einen Namen für die neue Übung eingeben.";
  if(name.length > 40) return "Der Name ist zu lang (maximal 40 Zeichen).";

  var day = dayById(dayId);
  if(!day) return "Trainingstag nicht gefunden.";
  var idx = day.ex.map(function(e){ return e.id; }).indexOf(oldId);
  if(idx < 0) return "Übung nicht gefunden.";

  var old = POOL[oldId];
  if(name.toLowerCase() === old.n.trim().toLowerCase()) return "Das ist bereits die aktuelle Übung.";

  for(var i=0;i<day.ex.length;i++){
    if(i !== idx && day.ex[i].n.trim().toLowerCase() === name.toLowerCase()){
      return "\u201E" + name + "\u201C steht schon in diesem Trainingstag.";
    }
  }

  var existing = findByName(name);
  var newId;
  if(existing){
    newId = existing.id;
    existing.dayId = dayId;
    if(POOL[newId].sets == null) POOL[newId].sets = old.sets;
    if(POOL[newId].rmin == null) POOL[newId].rmin = old.rmin;
    customEx[newId] = POOL[newId];
  } else {
    newId = slugId(name);
    POOL[newId] = { id:newId, n:name, sets:old.sets, rmin:old.rmin, rmax:old.rmax,
                    p:"", planTrend:null, dayId:dayId };
    customEx[newId] = POOL[newId];
  }

  var ids = day.ex.map(function(e){ return e.id; });
  ids[idx] = newId;
  planOrder[dayId] = ids;
  savePlan();
  applyPlan();
  Sync.pushPlan();
  return null;
}

/** Setzt den Slot auf die Übung aus dem Originalplan zurück. */
function restoreSlot(dayId, idx){
  var day = dayById(dayId);
  if(!day || !day.base[idx]) return "Kein Originaleintrag vorhanden.";
  var ids = day.ex.map(function(e){ return e.id; });
  ids[idx] = day.base[idx];
  planOrder[dayId] = ids;
  savePlan();
  applyPlan();
  Sync.pushPlan();
  return null;
}

var swapCtx = null;

function openSwap(dayId, exId){
  swapCtx = { dayId:dayId, exId:exId, error:null };
  renderSwap();
  var dlg = document.getElementById("swap-dialog");
  if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  var inp = document.getElementById("swap-input");
  if(inp) setTimeout(function(){ inp.focus(); }, 60);
}

function closeSwap(){
  var dlg = document.getElementById("swap-dialog");
  if(typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open");
  swapCtx = null;
}

function renderSwap(){
  if(!swapCtx) return;
  var body = document.getElementById("swap-dlg-body");
  var lead = document.getElementById("swap-dlg-lead");
  while(body.firstChild) body.removeChild(body.firstChild);

  var day = dayById(swapCtx.dayId);
  var ex  = POOL[swapCtx.exId];
  if(!day || !ex){ closeSwap(); return; }
  var idx = day.ex.map(function(e){ return e.id; }).indexOf(ex.id);

  lead.textContent = "\u201E" + ex.n + "\u201C in " + day.name
    + " ersetzen. Der bisherige Verlauf bleibt erhalten und ist im Fortschritt weiter abrufbar.";

  if(swapCtx.error) body.appendChild(h("p", { class:"dlg-err", text:swapCtx.error }));

  var label = h("label", { class:"swap-label", for:"swap-input", text:"Neue Übung" });
  body.appendChild(label);

  var inp = h("input", { class:"swap-input", id:"swap-input", type:"text", list:"swap-known",
    autocomplete:"off", enterkeyhint:"done", maxlength:"40", placeholder:"Name der neuen Übung" });
  body.appendChild(inp);

  /* Bereits bekannte Übungen vorschlagen — die Auswahl einer davon
     führt ihre vorhandene Historie wieder mit dem Slot zusammen. */
  var dl = h("datalist", { id:"swap-known" });
  var seen = {};
  day.ex.forEach(function(e){ seen[e.id] = true; });
  Object.keys(POOL).forEach(function(id){
    if(seen[id]) return;
    dl.appendChild(h("option", { value:POOL[id].n }));
  });
  body.appendChild(dl);

  body.appendChild(h("p", { class:"dlg-note",
    text:"Sätze und Wiederholungen (" + specText(ex) + ") werden übernommen." }));

  function submit(){
    var err = swapExercise(swapCtx.dayId, swapCtx.exId, inp.value);
    if(err){ swapCtx.error = err; renderSwap(); return; }
    var name = inp.value.trim().replace(/\s+/g, " ");
    closeSwap();
    rebuildAll();
    toast("Getauscht: \u201E" + name + "\u201C");
  }
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); submit(); } });

  var go = h("button", { class:"btn-line primary", type:"button", text:"Tauschen" });
  go.addEventListener("click", submit);
  body.appendChild(go);

  var baseEx = POOL[day.base[idx]];
  if(baseEx && baseEx.id !== ex.id){
    var back = h("button", { class:"btn-line", type:"button",
      text:"Original wiederherstellen: " + baseEx.n });
    back.addEventListener("click", function(){
      var err = restoreSlot(swapCtx.dayId, idx);
      if(err){ swapCtx.error = err; renderSwap(); return; }
      closeSwap();
      rebuildAll();
      toast("Wiederhergestellt: \u201E" + baseEx.n + "\u201C");
    });
    body.appendChild(back);
  }
}

function wireSwapUi(){
  document.getElementById("swap-cancel").addEventListener("click", closeSwap);
  document.getElementById("swap-dialog").addEventListener("close", function(){ swapCtx = null; });
}

/* ============================================================
   11. Geräte-Sync — Cloud Firestore mit Offline-Persistenz
   ------------------------------------------------------------
   Gespeicherte Einheiten liegen unter users/{uid}/sessions und
   werden zwischen Handy und PC abgeglichen. Der lokale
   IndexedDB-Cache von Firestore hält die App auch ohne Netz
   nutzbar; Schreibvorgänge laufen nach, sobald wieder Netz da
   ist. Ohne Konfiguration bleibt die App rein lokal.
   ============================================================ */
const K_FBCFG = "trainingsplan.v1.firebaseConfig";
const SDK_URL = "./vendor/firebase.js";

const Sync = (function(){
  var st = { status:"unconfigured", email:null, error:null, pending:false };
  var M = null, unsub = null, unsubPlan = null, uid = null;

  function readConfig(){
    var local = store.read(K_FBCFG, null);
    if(local && local.apiKey && local.projectId) return local;
    var g = window.FIREBASE_CONFIG;
    if(g && g.apiKey && g.projectId) return g;
    return null;
  }

  function set(status, extra){
    st.status = status;
    if(status !== "error") st.error = null;
    if(extra) for(var k in extra) st[k] = extra[k];
    renderChip();
    if(document.getElementById("sync-dialog").open) renderDialog();
  }

  async function boot(){
    var conf = readConfig();
    if(!conf){ set("unconfigured"); return; }
    set("loading");
    try {
      var F = await import(SDK_URL);

      var app = F.getApps().length ? F.getApp() : F.initializeApp(conf);
      var db  = F.initializeFirestore(app, {
        localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() })
      });
      var auth = F.getAuth(app);

      /* Lokaler Firebase-Emulator zum Testen — greift ausschliesslich auf
         localhost und nur mit ?emulator=1 in der Adresse. */
      if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]emulator=1/.test(location.search)){
        F.connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings:true });
        F.connectFirestoreEmulator(db, "127.0.0.1", 8080);
      }

      M = { app:app, db:db, auth:auth, F:F };

      try { await F.getRedirectResult(auth); } catch(e){}

      F.onAuthStateChanged(auth, function(user){
        if(unsub){ unsub(); unsub = null; }
        if(unsubPlan){ unsubPlan(); unsubPlan = null; }
        if(!user){ uid = null; set("signed-out", { email:null }); return; }
        uid = user.uid;
        set("syncing", { email:user.email || user.displayName || "angemeldet", error:null });
        pushAll().then(pushPlan).then(subscribe).catch(function(e){ set("error", { error:describe(e) }); });
      });
    } catch(e){
      set("error", { error: navigator.onLine ? describe(e) : "Offline — Sync startet, sobald wieder Netz da ist." });
    }
  }

  function describe(e){
    var c = (e && e.code) || "";
    if(c === "auth/unauthorized-domain") return "Diese Domain ist in Firebase nicht freigegeben. In der Firebase Console unter Authentication → Settings → Authorized domains eintragen: " + location.hostname;
    if(c === "auth/operation-not-allowed") return "Google-Anmeldung ist im Firebase-Projekt nicht aktiviert (Authentication → Sign-in method).";
    if(c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return "Anmeldung abgebrochen.";
    if(c === "permission-denied") return "Zugriff verweigert — bitte die Firestore-Regeln aus firestore.rules veröffentlichen.";
    if(c === "failed-precondition") return "Firestore ist im Projekt noch nicht angelegt (Firestore Database → Create database).";
    return (e && e.message) ? String(e.message) : "Unbekannter Fehler";
  }

  function ref(s){ return M.F.doc(M.db, "users", uid, "sessions", s.dayId + "_" + s.date); }

  function push(s){
    if(!M || !uid) return Promise.resolve();
    return M.F.setDoc(ref(s), {
      date:s.date, dayId:s.dayId, entries:s.entries, updatedAt: M.F.serverTimestamp()
    }, { merge:true });
  }

  function removeSession(s){
    if(!M || !uid) return Promise.resolve();
    return M.F.deleteDoc(ref(s));
  }

  function removeEntry(s, exId){
    if(!M || !uid) return Promise.resolve();
    var patch = { entries:{} };
    patch.entries[exId] = M.F.deleteField();
    return M.F.setDoc(ref(s), patch, { merge:true });
  }

  function pushAll(){
    if(!M || !uid) return Promise.resolve();
    return Promise.all(sessions.map(function(s){ return push(s).catch(function(){}); }));
  }

  function planRef(){ return M.F.doc(M.db, "users", uid, "state", "plan"); }

  function pushPlan(){
    if(!M || !uid) return Promise.resolve();
    return M.F.setDoc(planRef(), {
      order: planOrder, exercises: customEx, spec: exSpec,
      updatedAt: M.F.serverTimestamp()
    }, { merge:true });
  }

  function subscribePlan(){
    if(!M || !uid) return;
    unsubPlan = M.F.onSnapshot(planRef(), function(snap){
      var v = snap.data();
      if(!v) return;
      if(v.exercises && typeof v.exercises === "object"){
        customEx = v.exercises;
        Object.keys(customEx).forEach(function(id){
          var e = customEx[id];
          if(e && typeof e.n === "string" && e.n) POOL[id] = e;
        });
      }
      if(v.order && typeof v.order === "object") planOrder = v.order;
      if(v.spec && typeof v.spec === "object") exSpec = v.spec;
      store.write(K_PLAN, planOrder);
      store.write(K_CUSTOMEX, customEx);
      store.write(K_EXSPEC, exSpec);
      applyPlan();
      rebuildAll();
    }, function(){});
  }

  function subscribe(){
    if(!M || !uid) return;
    subscribePlan();
    var col = M.F.collection(M.db, "users", uid, "sessions");
    unsub = M.F.onSnapshot(col, function(snap){
      var remote = [];
      snap.forEach(function(d){
        var v = d.data();
        if(v && typeof v.date === "string" && v.dayId && v.entries) {
          remote.push({ date:v.date, dayId:v.dayId, entries:v.entries });
        }
      });
      sessions = remote;
      saveSessions();
      st.pending = snap.metadata.hasPendingWrites;
      set(st.pending ? "pending" : "ready", { error:null });
      refreshFromData();
      renderLog();
    }, function(err){
      set("error", { error:describe(err) });
    });
  }

  return {
    state: st,
    configured: function(){ return !!readConfig(); },
    init: boot,
    push: function(s){ push(s).catch(function(){}); },
    pushPlan: function(){ if(M && uid) pushPlan().catch(function(){}); },
    removeSession: function(s){ removeSession(s).catch(function(){}); },
    removeEntry: function(s, exId){ removeEntry(s, exId).catch(function(){}); },
    saveConfig: function(text){
      var obj;
      try {
        var t = String(text).trim().replace(/^const\s+firebaseConfig\s*=\s*/, "").replace(/;+\s*$/, "");
        obj = (new Function("return (" + t + ")"))();
      } catch(e){ return "Konnte nicht gelesen werden — bitte das komplette firebaseConfig-Objekt einfügen."; }
      if(!obj || !obj.apiKey || !obj.projectId) return "Es fehlen apiKey oder projectId.";
      store.write(K_FBCFG, obj);
      boot();
      return null;
    },
    clearConfig: function(){
      store.write(K_FBCFG, null);
      if(unsub){ unsub(); unsub = null; }
      if(unsubPlan){ unsubPlan(); unsubPlan = null; }
      M = null; uid = null;
      set("unconfigured", { email:null, error:null });
    },
    signIn: async function(){
      if(!M) return;
      try {
        await M.F.signInWithPopup(M.auth, new M.F.GoogleAuthProvider());
      } catch(e){
        var c = (e && e.code) || "";
        if(c === "auth/popup-blocked" || c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request"){
          try { await M.F.signInWithRedirect(M.auth, new M.F.GoogleAuthProvider()); return; }
          catch(e2){ set("error", { error:describe(e2) }); return; }
        }
        set("error", { error:describe(e) });
      }
    },
    signOut: async function(){
      if(!M) return;
      if(unsub){ unsub(); unsub = null; }
      if(unsubPlan){ unsubPlan(); unsubPlan = null; }
      try { await M.F.signOut(M.auth); } catch(e){}
    }
  };
})();

    body.appendChild(buildSetupGuide());

    var ta = h("textarea", { spellcheck:"false", "aria-label":"Firebase-Konfiguration",
      placeholder:'{\n  "apiKey": "…",\n  "authDomain": "…",\n  "projectId": "…",\n  "appId": "…"\n}' });
    body.appendChild(ta);
    var btn = h("button", { class:"btn-line primary", type:"button", text:"Konfiguration speichern" });
    btn.addEventListener("click", function(){
      var err = Sync.saveConfig(ta.value);
      if(err){ Sync.state.error = err; renderDialog(); }
    });
    body.appendChild(btn);
    return;
  }

  if(s.status === "loading"){
    lead.textContent = "Verbindung wird aufgebaut …";
    return;
  }

  if(s.status === "signed-out"){
    lead.textContent = "Mit Google anmelden — danach sind die gespeicherten Einheiten auf allen Geräten identisch, die mit demselben Konto angemeldet sind.";
    var bIn = h("button", { class:"btn-line primary", type:"button", text:"Mit Google anmelden" });
    bIn.addEventListener("click", function(){ Sync.signIn(); });
    body.appendChild(bIn);
    var bReset = h("button", { class:"btn-line", type:"button", text:"Konfiguration zurücksetzen" });
    bReset.addEventListener("click", function(){ Sync.clearConfig(); });
    body.appendChild(bReset);
    return;
  }

  lead.textContent = s.status === "ready"
    ? "Alle gespeicherten Einheiten werden mit deinem Konto abgeglichen."
    : s.status === "pending"
      ? "Änderungen sind lokal gesichert und werden übertragen, sobald wieder Netz da ist."
      : "Wird abgeglichen …";

  var dl = document.createElement("dl");
  [["Konto", s.email || "—"], ["Einheiten", String(sessions.length)],
   ["Status", (SYNC_CHIP[s.status] || {}).label || "—"]].forEach(function(pair){
    var row = h("div", { class:"dlg-row" });
    row.appendChild(h("dt", { text:pair[0] }));
    row.appendChild(h("dd", { text:pair[1] }));
    dl.appendChild(row);
  });
  body.appendChild(dl);

  var bOut = h("button", { class:"btn-line", type:"button", text:"Abmelden" });
  bOut.addEventListener("click", function(){ Sync.signOut(); });
  body.appendChild(bOut);
}

function wireSyncUi(){
  var dlg = document.getElementById("sync-dialog");
  document.getElementById("sync-chip").addEventListener("click", function(){
    renderDialog();
    if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open","");
  });
  document.getElementById("sync-close").addEventListener("click", function(){
    if(typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open");
  });
  window.addEventListener("online", function(){
    if(Sync.state.status === "error" && Sync.configured()) Sync.init();
  });
}

/* ============================================================
   12. Navigation & Bootstrap
   ============================================================ */
const TAB_ICONS = {
  total:   ["M12 3v18","M5 8h14","M5 16h14"],
  upper:   ["M4 9v6","M20 9v6","M7 7v10","M17 7v10","M7 12h10"],
  lower:   ["M7 4v6a5 5 0 0 0 10 0V4","M9 20h6","M12 15v5"],
  arms:    ["M6 6a3 3 0 0 1 3 3v3a3 3 0 0 1-6 0V9","M18 6a3 3 0 0 0-3 3v3a3 3 0 0 0 6 0V9","M9 12h6"],
  progress:["M4 19h16","M6 15l4-5 3 3 5-7"]
};

function buildTabs(){
  var bar = document.querySelector(".tabbar");
  var items = DAYS.map(function(d){ return { id:d.id, label:d.short }; });
  items.push({ id:"progress", label:"Fortschritt" });

  items.forEach(function(it){
    var b = h("button", { type:"button", role:"tab", id:"tab-"+it.id, "aria-controls":"panel-"+it.id, "aria-selected":"false" });
    var ic = svg("svg", { viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", "stroke-linecap":"round", "stroke-linejoin":"round", "aria-hidden":"true" });
    (TAB_ICONS[it.id] || []).forEach(function(d){ svg("path", { d:d }, ic); });
    b.appendChild(ic);
    b.appendChild(h("span", { text:it.label }));
    b.addEventListener("click", function(){
      showTab(it.id);
      window.scrollTo({ top:0, behavior:"auto" });
    });
    bar.appendChild(b);
  });
}

function showTab(id){
  document.querySelectorAll(".view").forEach(function(v){ v.classList.toggle("is-active", v.getAttribute("data-view") === id); });
  document.querySelectorAll(".tabbar button").forEach(function(b){ b.setAttribute("aria-selected", b.id === "tab-"+id ? "true" : "false"); });
  ui.tab = id; saveUi();
  if(id === "progress"){ renderProgress(); renderLog(); }
}

/** Aktualisiert die Ansicht aus den Daten, ohne das DOM neu zu bauen —
    damit ein eintreffender Sync keine laufende Eingabe zerstört. */
function refreshFromData(){
  DAYS.forEach(function(day){
    var view = document.querySelector('.view[data-view="' + day.id + '"]');
    if(!view) return;
    var lastS = lastSessionOf(day.id);
    var meta = view.querySelector(".day-meta");
    if(meta){
      meta.textContent = lastS ? "Zuletzt " + DF_LONG.format(isoToDate(lastS.date)) : "Noch kein Training erfasst";
    }
    day.ex.forEach(function(e){
      refreshHistory(e.id);
      var inp = view.querySelector('.ex[data-ex="' + CSS.escape(e.id) + '"] input');
      if(inp && document.activeElement !== inp){
        var w = lastWeight(e.id);
        inp.placeholder = w != null ? fmtKg(w) : "0";
      }
    });
    updateSaveBar(day.id);
  });
  renderProgress();
}

function rebuildAll(){
  var main = document.getElementById("main");
  while(main.firstChild) main.removeChild(main.firstChild);
  DAYS.forEach(function(d){ main.appendChild(buildDayView(d)); });
  main.appendChild(buildProgressView());
  DAYS.forEach(function(d){ updateSaveBar(d.id); });
  renderLog();
  showTab(ui.tab && (DAYS.some(function(d){ return d.id === ui.tab; }) || ui.tab === "progress") ? ui.tab : DAYS[0].id);
  renderProgress();
}

applyPlan();

/* Die Plan-Vorgabe "+" (z. B. HipThrust 110 kg +) steht als Hinweis in der
   Karte, wird aber NICHT in den Schalter vorbelegt: eine Vorauswahl würde
   sonst als Eingabe zählen und die Übung in jede gespeicherte Einheit
   schreiben, auch wenn sie gar nicht trainiert wurde. */

buildTabs();
wireSyncUi();
wireSwapUi();
wireSpecUi();
renderChip();
rebuildAll();
Sync.init();

if(!store.available) toast("Speicher nicht verfügbar — Daten gehen beim Schließen verloren");

var resizeTimer = null;
window.addEventListener("resize", function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    if(ui.tab === "progress") renderProgress();
  }, 150);
});

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
})();
</script>
